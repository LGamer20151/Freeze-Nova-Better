<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Cube</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  a.back { color: #0ff; text-decoration: none; align-self: flex-start; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; margin: 10px 0; }
  #score { font-size: 24px; margin-bottom: 10px; }
  canvas {
    border: 2px solid #0ff;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    background: #05020f;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background: #f0f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #05020f;
    font-weight: bold;
  }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Flappy Cube</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="600"></canvas>
<button id="restart">New Game</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

const gravity = 0.25;
let velocity = 0;
let score = 0;
let gameInterval;
let pipes = [];
let flappy = { x: 50, y: 150, width: 20, height: 20 };

function createPipe() {
  const gapHeight = 200;
  const pipeHeight = Math.random() * 200 + 50;
  return {
    bottom: { x: canvas.width, y: canvas.height, width: 30, height: pipeHeight },
    top: { x: canvas.width, y: pipeHeight + gapHeight, width: 30, height: canvas.height - pipeHeight - gapHeight }
  };
}

function draw() {
  ctx.fillStyle = "#05020f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#0ff";
  ctx.fillRect(flappy.x, flappy.y, flappy.width, flappy.height);

  pipes.forEach(pipe => {
    ctx.fillStyle = "#f0f";
    ctx.fillRect(pipe.bottom.x, pipe.bottom.y, pipe.bottom.width, pipe.bottom.height);
    ctx.fillRect(pipe.top.x, pipe.top.y, pipe.top.width, pipe.top.height);
  });

  ctx.fillStyle = "#fff";
  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 10, 30);
}

function update() {
  velocity += gravity;
  flappy.y += velocity;

  if (flappy.y + flappy.height >= canvas.height) {
    gameOver();
    return;
  }

  pipes.forEach(pipe => {
    pipe.bottom.x -= 2;
    pipe.top.x -= 2;
  });

  pipes = pipes.filter(pipe => pipe.bottom.x + pipe.bottom.width > 0);

  pipes.forEach(pipe => {
    if (flappy.x < pipe.bottom.x + pipe.bottom.width && flappy.x + flappy.width > pipe.bottom.x &&
        (flappy.y < pipe.bottom.y + pipe.bottom.height || flappy.y + flappy.height > pipe.top.y)) {
      gameOver();
    }
  });

  if (pipes[0].bottom.x + pipes[0].bottom.width < flappy.x + flappy.width && !pipes[0].scored) {
    score++;
    scoreEl.textContent = "Score: " + score;
    pipes[0].scored = true;
  }

  draw();
}

function gameOver() {
  clearInterval(gameInterval);
  alert("Game Over! Score: " + score);
}

window.addEventListener("keydown", e => {
  if (e.code === "Space") velocity = -5;
});

function start() {
  flappy.y = 150;
  velocity = 0;
  score = 0;
  scoreEl.textContent = "Score: 0";
  pipes = [createPipe()];
  clearInterval(gameInterval);
  gameInterval = setInterval(update, 20);
}

document.getElementById("restart").onclick = start;
start();
</script>
</body>
</html>
