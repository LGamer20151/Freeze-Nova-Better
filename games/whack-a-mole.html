<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  a.back { color: #0ff; text-decoration: none; align-self: flex-start; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; margin: 10px 0; }
  #score { font-size: 24px; margin-bottom: 10px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-gap: 15px;
    margin-top: 20px;
  }
  .hole {
    width: 100px;
    height: 100px;
    background: #1a0b2e;
    border: 2px solid #0ff;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .mole {
    background: #f0f;
    box-shadow: 0 0 15px #f0f;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background: #f0f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #05020f;
    font-weight: bold;
  }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Whack-a-Mole</h1>
<div id="score">Score: 0</div>
<div id="grid">
  <div class="hole" id="0"></div>
  <div class="hole" id="1"></div>
  <div class="hole" id="2"></div>
  <div class="hole" id="3"></div>
  <div class="hole" id="4"></div>
  <div class="hole" id="5"></div>
  <div class="hole" id="6"></div>
  <div class="hole" id="7"></div>
  <div class="hole" id="8"></div>
</div>
<button id="start">Start Game</button>

<script>
const holes = document.querySelectorAll('.hole');
const scoreEl = document.getElementById('score');
const startBtn = document.getElementById('start');
let score = 0;
let lastHole;
let timeUp = false;
let moleTimeout;

function randomTime(min, max) {
  return Math.round(Math.random() * (max - min) + min);
}

function randomHole(holes) {
  const idx = Math.floor(Math.random() * holes.length);
  const hole = holes[idx];
  if (hole === lastHole) return randomHole(holes);
  lastHole = hole;
  return hole;
}

function peep() {
  const time = randomTime(500, 1000);
  const hole = randomHole(holes);
  hole.classList.add('mole');
  hole.textContent = '👾';
  
  moleTimeout = setTimeout(() => {
    hole.classList.remove('mole');
    hole.textContent = '';
    if (!timeUp) peep();
  }, time);
}

function startGame() {
  score = 0;
  scoreEl.textContent = 'Score: 0';
  timeUp = false;
  peep();
  setTimeout(() => timeUp = true, 15000); // 15 second game
}

function whack(e) {
  if (!e.target.classList.contains('mole')) return;
  score++;
  e.target.classList.remove('mole');
  e.target.textContent = '';
  scoreEl.textContent = 'Score: ' + score;
}

holes.forEach(hole => hole.addEventListener('click', whack));
startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
