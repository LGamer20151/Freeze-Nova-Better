<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  a.back { color: #0ff; text-decoration: none; align-self: flex-start; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; margin: 10px 0; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-gap: 10px;
    margin-bottom: 20px;
  }
  .cell {
    width: 100px;
    height: 100px;
    background: #0ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
  }
  .cell.x { background: #f00; color: #fff; }
  .cell.o { background: #0f0; color: #fff; }
  button {
    padding: 10px 20px;
    font-size: 16px;
    background: #f0f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #05020f;
    font-weight: bold;
  }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Tic Tac Toe</h1>
<div id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>
<button id="restart">New Game</button>

<script>
const cells = document.querySelectorAll('.cell');
let currentPlayer = 'x';
let board = ['', '', '', '', '', '', '', '', ''];

function checkWin() {
  const winningCombinations = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
    [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
    [0, 4, 8], [2, 4, 6]             // Diagonals
  ];

  for (let combo of winningCombinations) {
    const [a, b, c] = combo;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      alert(`Player ${board[a].toUpperCase()} wins!`);
      restartGame();
      return;
    }
  }

  if (board.every(cell => cell)) {
    alert("It's a draw!");
    restartGame();
  }
}

function playerMove(index) {
  if (!board[index]) {
    board[index] = currentPlayer;
    cells[index].classList.add(currentPlayer);
    cells[index].textContent = currentPlayer;
    checkWin();
    currentPlayer = currentPlayer === 'x' ? 'o' : 'x';
    if (currentPlayer === 'o') computerMove();
  }
}

function computerMove() {
  let availableMoves = board.map((cell, index) => cell ? null : index);
  if (availableMoves.length > 0) {
    let move = availableMoves[Math.floor(Math.random() * availableMoves.length)];
    playerMove(move);
  }
}

function restartGame() {
  board.fill('');
  currentPlayer = 'x';
  cells.forEach(cell => {
    cell.classList.remove('x', 'o');
    cell.textContent = '';
  });
}

cells.forEach(cell => cell.addEventListener('click', () => playerMove(cell.dataset.index)));
document.getElementById('restart').addEventListener('click', restartGame);
restartGame();
</script>
</body>
</html>
