<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
  }
  canvas { border: 1px solid #0ff; }
  a.back { color: #0ff; text-decoration: none; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; }
  #score { margin-top: 10px; }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Snake Game</h1>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="score">Score: 0</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scale = 20;
const rows = canvas.height / scale;
const columns = canvas.width / scale;

let snake;
let snakeDirection = 'right';
let food;
let score = 0;

function createSnake() {
  let length = 5;
  let snake = [];
  for (let i = length - 1; i >= 0; i--) {
    snake.push({ x: i, y: 0 });
  }
  return snake;
}

function createFood() {
  return {
    x: Math.floor(Math.random() * columns),
    y: Math.floor(Math.random() * rows)
  };
}

function collision(head, array) {
  for (let i = 0; i < array.length; i++) {
    if (head.x === array[i].x && head.y === array[i].y) return true;
  }
  return false;
}

function draw() {
  ctx.fillStyle = '#1a0b2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? '#0ff' : '#f0f';
    ctx.fillRect(snake[i].x * scale, snake[i].y * scale, scale, scale);
  }

  ctx.fillStyle = '#f0f';
  ctx.fillRect(food.x * scale, food.y * scale, scale, scale);
  document.getElementById('score').innerText = "Score: " + score;
}

function move() {
  const head = { x: snake[0].x, y: snake[0].y };
  if (snakeDirection === 'right') head.x++;
  if (snakeDirection === 'left') head.x--;
  if (snakeDirection === 'up') head.y--;
  if (snakeDirection === 'down') head.y++;

  if (
    head.x === -1 || head.x === columns ||
    head.y === -1 || head.y === rows ||
    collision(head, snake)
  ) {
    alert('Game Over!');
    document.location.reload();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    food = createFood();
  } else {
    snake.pop();
  }
}

function main() {
  if (score > 0) {
    setTimeout(function onTick() {
      clearCanvas();
      draw();
      move();
      main();
    }, 100);
  }
}

function clearCanvas() {
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function changeDirection(event) {
  const LEFT_KEY = 37;
  const RIGHT_KEY = 39;
  const UP_KEY = 38;
  const DOWN_KEY = 40;

  const keyPressed = event.keyCode;
  const goingUp = snakeDirection === 'up';
  const goingDown = snakeDirection === 'down';
  const goingRight = snakeDirection === 'right';
  const goingLeft = snakeDirection === 'left';

  if (keyPressed === LEFT_KEY && !goingRight) {
    snakeDirection = 'left';
  }
  if (keyPressed === UP_KEY && !goingDown) {
    snakeDirection = 'up';
  }
  if (keyPressed === RIGHT_KEY && !goingLeft) {
    snakeDirection = 'right';
  }
  if (keyPressed === DOWN_KEY && !goingUp) {
    snakeDirection = 'down';
  }
}

document.addEventListener('keydown', changeDirection);

// Initialize the game
snake = createSnake();
food = createFood();
main();
</script>
</body>
</html>
