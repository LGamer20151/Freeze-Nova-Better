<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  a.back { color: #0ff; text-decoration: none; align-self: flex-start; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; margin: 10px 0; }
  #score { font-size: 24px; margin-bottom: 10px; }
  canvas {
    border: 2px solid #0ff;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    background: #05020f;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background: #f0f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #05020f;
    font-weight: bold;
  }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Home</a>
<h1>Snake</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<button id="restart">New Game</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

const gridSize = 20;
const tileCount = 20;
let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let dx = 0;
let dy = 0;
let score = 0;
let gameInterval;

function draw() {
  // Clear
  ctx.fillStyle = "#05020f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Snake
  ctx.fillStyle = "#0ff";
  ctx.shadowBlur = 10;
  ctx.shadowColor = "#0ff";
  snake.forEach(part => ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2));

  // Draw Food
  ctx.fillStyle = "#f0f";
  ctx.shadowColor = "#f0f";
  ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
  ctx.shadowBlur = 0;
}

function update() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  // Wall collision
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return gameOver();
  
  // Self collision
  if (snake.some(part => part.x === head.x && part.y === head.y)) return gameOver();

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = "Score: " + score;
    food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
  } else {
    snake.pop();
  }
  
  draw();
}

function gameOver() {
  clearInterval(gameInterval);
  alert("Game Over! Score: " + score);
}

window.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && dy !== 1) { dx = 0; dy = -1; }
  if (e.key === "ArrowDown" && dy !== -1) { dx = 0; dy = 1; }
  if (e.key === "ArrowLeft" && dx !== 1) { dx = -1; dy = 0; }
  if (e.key === "ArrowRight" && dx !== -1) { dx = 1; dy = 0; }
});

function start() {
  snake = [{x: 10, y: 10}];
  dx = 0; dy = 0;
  score = 0;
  scoreEl.textContent = "Score: 0";
  clearInterval(gameInterval);
  gameInterval = setInterval(update, 100);
}

document.getElementById("restart").onclick = start;
start();
</script>
</body>
</html>
