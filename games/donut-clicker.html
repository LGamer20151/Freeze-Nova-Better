<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donut Clicker</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  a.back { color: #0ff; text-decoration: none; align-self: flex-start; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; margin: 10px 0; }
  #score { font-size: 24px; margin-bottom: 10px; }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background: #f0f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #05020f;
    font-weight: bold;
  }
  #store {
    margin-top: 20px;
    text-align: center;
  }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Donut Clicker</h1>
<div id="score">Score: 0</div>
<button id="clicker">Click Me!</button>
<div id="store"></div>

<script>
let score = 0;
let autoClickers = 0;
let upgradesPurchased = 0;

function updateScore() {
  document.getElementById("score").textContent = "Score: " + score;
  document.getElementById("store").innerHTML = generateStore();
}

function clickDonut() {
  score += 1;
  updateScore();
}

function buyAutoClicker() {
  const cost = 10 * Math.pow(2, autoClickers);
  if (score >= cost) {
    score -= cost;
    autoClickers++;
    updateScore();
    setInterval(clickDonut, 1000);
  }
}

function buyUpgrade() {
  const cost = 50 * Math.pow(2, upgradesPurchased);
  if (score >= cost) {
    score -= cost;
    upgradesPurchased++;
    updateScore();
  }
}

function generateStore() {
  return `
    <h3>Store</h3>
    <p>Auto-Clicker: Clicks every second</p>
    <button onclick="buyAutoClicker()">Buy Auto-Clicker - Cost: ${10 * Math.pow(2, autoClickers)}</button>
    <p>Upgrade: Double Click Value</p>
    <button onclick="buyUpgrade()">Buy Upgrade - Cost: ${50 * Math.pow(2, upgradesPurchased)}</button>
  `;
}

document.getElementById("clicker").addEventListener("click", clickDonut);
document.getElementById("clicker").style.backgroundColor = "#0ff";
document.getElementById("clicker").style.color = "#05020f";
updateScore();
</script>
</body>
</html>
