<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #0ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
  }
  canvas { border: 1px solid #0ff; }
  a.back { color: #0ff; text-decoration: none; margin-top: 10px; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Space Invaders</h1>
<canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 30,
  width: 50,
  height: 20,
  speed: 5
};

let bullets = [];
let invaders = [];
const rows = 4;
const cols = 11;
const invaderSize = 20;
const invaderGap = 15;
const invaderRowGap = 30;
const invaderColGap = 20;
let direction = 1;
let moveDown = false;

for (let i = 0; i < rows; i++) {
  invaders[i] = [];
  for (let j = 0; j < cols; j++) {
    invaders[i][j] = {
      x: j * (invaderSize + invaderColGap) + invaderColGap,
      y: i * (invaderSize + invaderRowGap) + invaderRowGap + 30,
      width: invaderSize,
      height: invaderSize,
      alive: true
    };
  }
}

function drawPlayer() {
  ctx.fillStyle = '#0ff';
  ctx.fillRect(player.x, player.y, player.width, player.height);
}

function drawInvaders() {
  ctx.fillStyle = '#f0f';
  invaders.forEach(row => {
    row.forEach(invader => {
      if (invader.alive) {
        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
      }
    });
  });
}

function drawBullets() {
  bullets.forEach(bullet => {
    ctx.fillStyle = '#f0f';
    ctx.fillRect(bullet.x, bullet.y, 5, 10);
  });
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function updatePlayer() {
  if (keys.left && player.x > 0) {
    player.x -= player.speed;
  }
  if (keys.right && player.x < canvas.width - player.width) {
    player.x += player.speed;
  }
}

function updateBullets() {
  bullets = bullets.filter(bullet => bullet.y > 0);
  bullets.forEach(bullet => {
    bullet.y -= 5;
  });
}

function updateInvaders() {
  const rightEdge = invaders[0].some(invader => invader.x + invader.width >= canvas.width);
  const leftEdge = invaders[0].some(invader => invader.x <= 0);

  if (rightEdge || leftEdge) {
    direction *= -1;
    moveDown = true;
  }

  if (moveDown) {
    invaders.forEach(row => row.forEach(invader => invader.y += 10));
    moveDown = false;
  }

  invaders.forEach(row => {
    row.forEach(invader => {
      if (invader.alive) {
        invader.x += direction * 2;
      }
    });
  });
}

function checkCollisions() {
  bullets.forEach((bullet, bulletIndex) => {
    invaders.forEach(row => {
      row.forEach(invader => {
        if (invader.alive && bullet.x < invader.x + invader.width &&
            bullet.x + 5 > invader.x &&
            bullet.y < invader.y + invader.height &&
            bullet.y + 10 > invader.y) {
          invader.alive = false;
          bullets.splice(bulletIndex, 1);
        }
      });
    });
  });

  invaders.forEach(row => {
    row.forEach(invader => {
      if (invader.alive && player.x < invader.x + invader.width &&
          player.x + player.width > invader.x &&
          player.y < invader.y + invader.height &&
          player.y + player.height > invader.y) {
        alert("Game Over!");
        document.location.reload();
      }
    });
  });
}

function updateGame() {
  clearCanvas();
  drawPlayer();
  drawInvaders();
  drawBullets();
  updatePlayer();
  updateBullets();
  updateInvaders();
  checkCollisions();
}

function keyDownHandler(e) {
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === ' ') {
    bullets.push({ x: player.x + player.width / 2 - 2.5, y: player.y });
  }
}

function keyUpHandler(e) {
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowLeft') keys.left = false;
}

document.addEventListener('keydown', keyDownHandler);
document.addEventListener('keyup', keyUpHandler);

let keys = { right: false, left: false };

function gameLoop() {
  updateGame();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
