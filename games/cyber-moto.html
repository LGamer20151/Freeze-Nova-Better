<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Moto Game</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #0ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
  }
  canvas { border: 1px solid #0ff; }
  a.back { color: #0ff; text-decoration: none; margin-top: 10px; }
  h1 { color: #0ff; text-shadow: 0 0 15px #0ff; }
</style>
</head>
<body>
<a class="back" href="../index.html">Back to Hub</a>
<h1>Cyber Moto</h1>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let moto = {
  x: canvas.width / 2,
  y: canvas.height - 100,
  width: 50,
  height: 20,
  speed: 5,
  angle: 0
};

let keys = {
  right: false,
  left: false,
  up: false
};

let obstacles = [];
const obstacleCount = 5;

for (let i = 0; i < obstacleCount; i++) {
  obstacles.push({
    x: Math.random() * (canvas.width - 30),
    y: Math.random() * (canvas.height / 2),
    width: 30,
    height: 30
  });
}

function drawMoto() {
  ctx.save();
  ctx.translate(moto.x, moto.y);
  ctx.rotate(moto.angle);
  ctx.fillStyle = '#0ff';
  ctx.fillRect(-moto.width / 2, -moto.height / 2, moto.width, moto.height);
  ctx.restore();
}

function drawObstacles() {
  ctx.fillStyle = '#f0f';
  obstacles.forEach(obstacle => {
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
  });
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function updateMoto() {
  if (keys.left && moto.x > 0) {
    moto.x -= moto.speed;
    moto.angle = -0.1;
  }
  if (keys.right && moto.x < canvas.width - moto.width) {
    moto.x += moto.speed;
    moto.angle = 0.1;
  }
  if (keys.up && moto.y > 0) {
    moto.y -= moto.speed;
  }
  if (!keys.left && !keys.right) {
    moto.angle = 0;
  }
}

function checkCollision() {
  obstacles.forEach(obstacle => {
    if (
      moto.x < obstacle.x + obstacle.width &&
      moto.x + moto.width > obstacle.x &&
      moto.y < obstacle.y + obstacle.height &&
      moto.y + moto.height > obstacle.y
    ) {
      alert("Game Over!");
      document.location.reload();
    }
  });
}

function updateGame() {
  clearCanvas();
  drawMoto();
  drawObstacles();
  updateMoto();
  checkCollision();
}

function keyDownHandler(e) {
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowUp') keys.up = true;
}

function keyUpHandler(e) {
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowUp') keys.up = false;
}

document.addEventListener('keydown', keyDownHandler);
document.addEventListener('keyup', keyUpHandler);

function gameLoop() {
  updateGame();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
