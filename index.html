<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreezeNova Moto X - GitHub Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrapper {
      width: 920px;
      max-width: 96vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 2px solid #1e293b;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #151c2c;
      border-bottom: 2px solid #263147;
      font-weight: 700;
      font-size: 15px;
    }
    .stat span { color: #38bdf8; }
    .bonus { color: #4ade80 !important; margin-left: 4px; }
    #levelBtns { display: flex; gap: 6px; }
    .lvl-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: 0.15s;
    }
    .lvl-btn:hover { background: #334155; }
    .lvl-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #172033 0%, #090d16 100%);
    }
    #controls {
      background: #151c2c;
      padding: 10px 20px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid #1e293b;
    }
    kbd {
      background: #263147;
      color: #f8fafc;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
      border-bottom: 2px solid #0f172a;
    }
  </style>
</head>
<body>

<div id="wrapper">
  <div id="hud">
    <div id="levelBtns">
      <button class="lvl-btn active" onclick="selectLevel(0)">LVL 1</button>
      <button class="lvl-btn" onclick="selectLevel(1)">LVL 2</button>
      <button class="lvl-btn" onclick="selectLevel(2)">LVL 3</button>
    </div>
    <div class="stat">TIME: <span id="timeDisplay">0.0s</span></div>
    <div class="stat">FLIPS: <span id="flipDisplay">0</span><span id="bonusDisplay" class="bonus"></span></div>
    <div class="stat">PROGRESS: <span id="progressDisplay">0%</span></div>
  </div>

  <canvas id="gameCanvas" width="920" height="500"></canvas>

  <div id="controls">
    <kbd>W</kbd>/<kbd>↑</kbd> Gas &nbsp;•&nbsp;
    <kbd>S</kbd>/<kbd>↓</kbd> Brake &nbsp;•&nbsp;
    <kbd>A</kbd>/<kbd>←</kbd> Backflip / Lean Back &nbsp;•&nbsp;
    <kbd>D</kbd>/<kbd>→</kbd> Frontflip / Lean Forward &nbsp;•&nbsp;
    <kbd>R</kbd> Checkpoint / Restart &nbsp;•&nbsp;
    <kbd>M</kbd> Mute Audio
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeEl = document.getElementById('timeDisplay');
const flipEl = document.getElementById('flipDisplay');
const bonusEl = document.getElementById('bonusDisplay');
const progressEl = document.getElementById('progressDisplay');
const lvlButtons = document.querySelectorAll('.lvl-btn');

// --- Synthesized Web Audio ---
let audioCtx = null;
let muted = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, type, duration, vol = 0.12) {
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playCrashSound() {
  playTone(110, 'sawtooth', 0.35, 0.25);
  playTone(65, 'square', 0.45, 0.25);
}

function playCheckpointSound() {
  playTone(523.25, 'sine', 0.15, 0.15);
  setTimeout(() => playTone(783.99, 'sine', 0.25, 0.15), 90);
}

function playFlipBonusSound() {
  playTone(659.25, 'triangle', 0.18, 0.16);
}

// --- Level Definitions (Fixed Arrays) ---
const LEVELS = [
  {
    name: "Level 1: Neon Ramps",
    starTimes:,
    finishX: 5600,
    checkpoints:,
    terrain: [
      { x: -300, y: 390 }, { x: 450, y: 390 },
      { x: 750, y: 315 },  { x: 920, y: 315 },
      { x: 1180, y: 405 }, { x: 1550, y: 405 },
      { x: 1850, y: 275 }, { x: 1970, y: 275 },
      { x: 2320, y: 405 }, { x: 2750, y: 405 },
      { x: 3020, y: 330 }, { x: 3260, y: 410 },
      { x: 3560, y: 295 }, { x: 3820, y: 295 },
      { x: 4080, y: 215 }, { x: 4200, y: 215 },
      { x: 4620, y: 400 }, { x: 5900, y: 400 }
    ],
    hazards: [
      { x: 1030, y: 390, w: 42, h: 30 },
      { x: 2110, y: 390, w: 65, h: 30 },
      { x: 4350, y: 385, w: 80, h: 30 }
    ]
  },
  {
    name: "Level 2: Canyon Gaps",
    starTimes:,
    finishX: 6400,
    checkpoints:,
    terrain: [
      { x: -300, y: 380 }, { x: 420, y: 380 },
      { x: 720, y: 270 },  { x: 840, y: 270 },
      { x: 1160, y: 420 }, { x: 1480, y: 420 },
      { x: 1750, y: 290 }, { x: 1870, y: 290 },
      { x: 2120, y: 390 }, { x: 2500, y: 390 },
      { x: 2800, y: 240 }, { x: 2920, y: 240 },
      { x: 3340, y: 430 }, { x: 3720, y: 430 },
      { x: 3980, y: 310 }, { x: 4200, y: 390 },
      { x: 4650, y: 390 }, { x: 4950, y: 250 },
      { x: 5080, y: 250 }, { x: 5480, y: 400 },
      { x: 6700, y: 400 }
    ],
    hazards: [
      { x: 960, y: 405, w: 70, h: 30 },
      { x: 3070, y: 415, w: 95, h: 30 },
      { x: 5220, y: 385, w: 95, h: 30 }
    ]
  },
  {
    name: "Level 3: Sky Launch",
    starTimes:,
    finishX: 7000,
    checkpoints:,
    terrain: [
      { x: -300, y: 400 }, { x: 380, y: 400 },
      { x: 680, y: 260 },  { x: 790, y: 260 },
      { x: 1150, y: 420 }, { x: 1420, y: 420 },
      { x: 1740, y: 230 }, { x: 1860, y: 230 },
      { x: 2260, y: 400 }, { x: 2650, y: 400 },
      { x: 2920, y: 310 }, { x: 3150, y: 420 },
      { x: 3480, y: 240 }, { x: 3600, y: 240 },
      { x: 4040, y: 430 }, { x: 4400, y: 430 },
      { x: 4650, y: 380 }, { x: 5050, y: 380 },
      { x: 5380, y: 210 }, { x: 5510, y: 210 },
      { x: 5980, y: 410 }, { x: 7300, y: 410 }
    ],
    hazards: [
      { x: 910, y: 405, w: 90, h: 30 },
      { x: 1990, y: 385, w: 100, h: 30 },
      { x: 3740, y: 415, w: 110, h: 30 },
      { x: 5660, y: 395, w: 120, h: 30 }
    ]
  }
];

let currentLevelIdx = 0;
let bike, startTime, elapsedTime, flips, timeBonus, state, airRotation;
let activeCheckpointX = 120;
let triggeredCheckpoints = new Set();
let particles = [];
let floatingTexts = [];

// Input Handling
const keys = {};
window.addEventListener('keydown', e => {
  initAudio();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
  keys[e.code] = true;
  if (e.code === 'KeyR') {
    if (state === 'finished') resetLevel(true);
    else resetLevel(false);
  }
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'Space' && state === 'finished') {
    selectLevel((currentLevelIdx + 1) % LEVELS.length);
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function selectLevel(idx) {
  currentLevelIdx = idx;
  lvlButtons.forEach((b, i) => b.classList.toggle('active', i === idx));
  resetLevel(true);
}

function resetLevel(fullReset = true) {
  if (fullReset) {
    activeCheckpointX = 120;
    triggeredCheckpoints.clear();
    startTime = performance.now();
    flips = 0;
    timeBonus = 0;
    bonusEl.textContent = '';
  }
  const ground = getTerrainHeight(activeCheckpointX);
  bike = {
    x: activeCheckpointX,
    y: ground.y - 45,
    vx: 0,
    vy: 0,
    angle: ground.slope,
    angVel: 0,
    grounded: false,
    radius: 16
  };
  airRotation = 0;
  particles = [];
  state = 'playing';
}

function getTerrainHeight(x) {
  const terrain = LEVELS[currentLevelIdx].terrain;
  for (let i = 0; i < terrain.length - 1; i++) {
    const p1 = terrain[i];
    const p2 = terrain[i + 1];
    if (x >= p1.x && x <= p2.x) {
      const t = (x - p1.x) / (p2.x - p1.x);
      return {
        y: p1.y + t * (p2.y - p1.y),
        slope: Math.atan2(p2.y - p1.y, p2.x - p1.x)
      };
    }
  }
  return { y: 400, slope: 0 };
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function spawnParticles(x, y, color, count, speed = 220) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 60,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color,
      size: 3 + Math.random() * 4
    });
  }
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1.2 });
}

function update(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  floatingTexts.forEach(ft => {
    ft.y -= 45 * dt;
    ft.life -= dt;
  });
  floatingTexts = floatingTexts.filter(ft => ft.life > 0);

  if (state !== 'playing') return;

  const lvl = LEVELS[currentLevelIdx];
  elapsedTime = Math.max(0, (performance.now() - startTime) / 1000 - timeBonus);

  const accel = keys['KeyW'] || keys['ArrowUp'];
  const brake = keys['KeyS'] || keys['ArrowDown'];
  const leanLeft = keys['KeyA'] || keys['ArrowLeft'];
