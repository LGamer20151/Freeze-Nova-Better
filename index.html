<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Neon Game Hub</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1a0b2e, #05020f);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 {
    color: #0ff;
    text-shadow: 0 0 15px #0ff;
    margin-bottom: 20px;
  }
  #searchBar {
    margin-bottom: 20px;
    color: #0ff;
    background: #000;
    padding: 5px;
    border-radius: 5px;
  }
  #searchBar input {
    width: 300px;
    padding: 5px;
    border: none;
    border-radius: 5px;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    margin: 10px 0;
  }
  a {
    color: #0ff;
    text-decoration: none;
    font-size: 24px;
  }
  a:hover {
    text-decoration: underline;
  }
  .section {
    margin-top: 30px;
  }
</style>
</head>
<body>
<h1>Cyber Neon Game Hub</h1>
<div id="searchBar">
  <input type="text" id="gameSearch" placeholder="Search games...">
</div>
<div class="section">
  <h2>Classic Games</h2>
  <ul id="classicGames">
    <li><a href="games/snake.html">Snake</a></li>
    <li><a href="games/flappy-cube.html">Flappy Cube</a></li>
    <li><a href="games/space-invaders.html">Space Invaders</a></li>
  </ul>
</div>
<div class="section">
  <h2>Action Games</h2>
  <ul id="actionGames">
    <li><a href="games/cyber-moto.html">Cyber Moto</a></li>
    <li><a href="games/whack-a-mole.html">Whack-a-Mole</a></li>
  </ul>
</div>
<div class="section">
  <h2>Strategy Games</h2>
  <ul id="strategyGames">
    <li><a href="games/tic-tac-toe.html">Tic Tac Toe</a></li>
    <li><a href="games/donut-clicker.html">Donut Clicker</a></li>
  </ul>
</div>

<script>
document.getElementById('gameSearch').addEventListener('input', function() {
  const query = this.value.toLowerCase();
  const games = document.querySelectorAll('a');

  games.forEach(game => {
    const gameText = game.textContent.toLowerCase();
    if (gameText.includes(query)) {
      game.parentElement.style.display = '';
    } else {
      game.parentElement.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
