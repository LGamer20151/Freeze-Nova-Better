<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freeze Nova Better</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Freeze Nova Better</h1>
  <p>Pick a game and start playing</p>
</header>

<main class="grid" id="games"></main>

<script>
const games = [
  { title: "Donut Clicker",  file: "games/donut-clicker.html",  desc: "Click donuts and buy upgrades.",      icon: "🍩" },
  { title: "Cyber Moto",     file: "games/cyber-moto.html",     desc: "Ride a neon bike over obstacles.",    icon: "🏍" },
  { title: "Memory Match",   file: "games/memory-match.html",   desc: "Flip cards and find the pairs.",      icon: "🃏" },
  { title: "Snake",          file: "games/snake.html",          desc: "Eat, grow, and avoid the walls.",     icon: "🐍" },
  { title: "Flappy Cube",    file: "games/flappy-cube.html",    desc: "Tap to fly through the gaps.",        icon: "🟦" },
  { title: "Whack-a-Mole",   file: "games/whack-a-mole.html",   desc: "Hit the moles before they hide.",     icon: "🔨" },
  { title: "Tic-Tac-Toe",    file: "games/tic-tac-toe.html",    desc: "Beat the computer in three in a row.", icon: "❌" },
  { title: "Reaction Test",  file: "games/reaction-test.html",  desc: "How fast are your reflexes?",         icon: "⚡" }
];

const container = document.getElementById("games");
for (const g of games) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = g.file;
  a.innerHTML = `<div class="icon">${g.icon}</div><h2>${g.title}</h2><p>${g.desc}</p>`;
  container.appendChild(a);
}
</script>
</body>
</html>
