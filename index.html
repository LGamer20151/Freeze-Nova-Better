<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Moto</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05020f;
    overflow: hidden;
    font-family: "Courier New", monospace;
    color: #0ff;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 16px;
    font-size: 18px;
    text-shadow: 0 0 8px #0ff;
    pointer-events: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 2, 15, 0.75);
    text-align: center;
    font-size: 20px;
    text-shadow: 0 0 10px #f0f;
  }
  #overlay h1 {
    font-size: 56px;
    margin: 0 0 16px;
    color: #f0f;
    text-shadow: 0 0 20px #f0f, 0 0 40px #f0f;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">DISTANCE: <span id="dist">0</span> m &nbsp; BEST: <span id="best">0</span> m</div>
<div id="overlay">
  <h1>CYBER MOTO</h1>
  <p>RIGHT / D = Throttle &nbsp; LEFT / A = Brake &nbsp; UP / W = Lean forward &nbsp; DOWN / S = Lean back</p>
  <p>Press ENTER or SPACE to start</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const distEl = document.getElementById("dist");
const bestEl = document.getElementById("best");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- Input ----------
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if ((e.code === "Enter" || e.code === "Space") && state === "menu") startGame();
  if (e.code === "KeyR" && state === "dead") startGame();
});
window.addEventListener("keyup", e => keys[e.code] = false);

const input = {
  throttle: () => keys.ArrowRight || keys.KeyD,
  brake:    () => keys.ArrowLeft || keys.KeyA,
  leanFwd:  () => keys.KeyW,
  leanBack: () => keys.KeyS,
  accelerate: () => keys.KeyW,
  decelerate: () => keys.KeyS
};

// ---------- Game state ----------
let state = "menu";
let best = 0;
let distance = 0;
let camX = 0;
const GRAVITY = 1800;
const GROUND_SEG = 40;
let terrain = [];
let particles = [];
let stars = [];
let bike;

// Levels
const levels = [
  { difficulty: 0.5, obstacles: [] }, // Level 1
  { difficulty: 0.7, obstacles: [] }, // Level 2
  { difficulty: 1.0, obstacles: [] }  // Level 3
];

let currentLevel = 0;

function getLevelDifficulty() {
  return levels[currentLevel].difficulty;
}

function loadLevel(levelIndex) {
  currentLevel = levelIndex;
  obstacles = [];
  // Load new obstacles for the current level
  // Example: addObstacle(1000, 'barrier');
}

// Bikes
const bikes = [
  { speed: 900, handling: 0.9, color: "#0ff" }, // Bike 1
  { speed: 800, handling: 1.1, color: "#f0f" }  // Bike 2
];

let selectedBike = 0;

function newBike() {
  const bikeConfig = bikes[selectedBike];
  return {
    x: 200,
    y: 0,
    vx: 0,
    vy: 0,
    angle: 0,
    angVel: 0,
    wheelR: 22,
    wheelAngle: 0,
    onGround: false,
    crashed: false,
    crashTimer: 0,
    speed: bikeConfig.speed,
    handling: bikeConfig.handling,
    color: bikeConfig.color
  };
}

// Obstacles
const obstacles = [];

function addObstacle(x, type) {
  obstacles.push({ x, type });
}

function drawObstacles() {
  for (const obs of obstacles) {
    ctx.fillStyle = "#ff0000";
    ctx.fillRect(obs.x - camX, groundY(obs.x) - 50, 50, 50); // Example obstacle
  }
}

function updateObstacles(dt) {
  for (const obs of obstacles) {
    obs.x -= bike.vx * dt / 10; // Move obstacles with the bike
    if (obs.x + 50 < 0) {
      obs.x = W + 50; // Reset obstacle to the other side
    }
  }
}

function checkObstacleCollision() {
  for (const obs of obstacles) {
    if (bike.x < obs.x + 50 && bike.x + 50 > obs.x && bike.y < groundY(obs.x) + 50) {
      crash();
      return;
    }
  }
}

// ---------- Update ----------
function update(dt) {
  if (state !== "play") return;

  if (bike.crashed) {
    bike.crashTimer += dt;
    updateParticles(dt);
    if (bike.crashTimer > 1.2) {
      state = "dead";
      if (distance > best) best = distance;
      bestEl.textContent = Math.floor(best);
      overlay.classList.remove("hidden");
      overlay.querySelector("h1").textContent = "SYSTEM FAILURE";
      overlay.querySelector("p:last-child").textContent = "Press R to reboot";
    }
    return;
  }

  const difficulty = getLevelDifficulty();
  const accel = input.throttle() ? 1 : 0;
  const brake = input.brake() ? 1 : 0;
  let accelForce = accel * 520 - brake * 380 - bike.vx * 0.15;
  if (!bike.onGround) accelForce *= 0.2;
  bike.vx += accelForce * dt;
  bike.vx = Math.max(0, Math.min(bike.vx, bike.speed));

  if (input.leanFwd()) bike.angVel += 6 * dt;
  if (input.leanBack()) bike.angVel -= 6 * dt;

  bike.vy += GRAVITY * dt * difficulty;
  bike.x += bike.vx * dt;
  bike.y += bike.vy * dt;
  distance = Math.max(distance, (bike.x - 200) / 10);

  const gy = groundY(bike.x) - bike.wheelR;
  const slope = (groundY(bike.x + 4) - groundY(bike.x - 4)) / 8;
  bike.onGround = false;
  if (bike.y >= gy) {
    const impact = bike.vy;
    bike.y = gy;
    bike.vy = 0;
    bike.onGround = true;
    if (impact > 700 && Math.abs(bike.angle) > 0.9) {
      crash();
      return;
    }
    if (impact > 500) spawnSparks(bike.x, bike.y + bike.wheelR, 14);
    bike.angVel += (Math.atan(slope) - bike.angle) * 0.2 * bike.handling;
    bike.angVel *= 0.6;
  } else {
    bike.angVel *= 0.995;
  }

  bike.angle += bike.angVel * dt;
  bike.angVel *= 0.99;
  if (Math.abs(bike.angle) > 1.6) {
    crash();
    return;
  }

  if (bike.onGround) bike.angle *= 0.9;
  bike.wheelAngle += bike.vx * dt / bike.wheelR;

  if (bike.onGround && input.throttle() && Math.random() < 0.6) {
    particles.push({ x: bike.x - 30, y: bike.y + 8, vx: -60 - Math.random() * 60, vy: -20 + Math.random() * -30, life: 0.5, col: bike.color });
  }

  updateParticles(dt);
  updateObstacles(dt);
  checkObstacleCollision();
  camX = bike.x - W * 0.3;
}

function crash() {
  bike.crashed = true;
  bike.crashTimer = 0;
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: bike.x, y: bike.y,
      vx: (Math.random() - 0.5) * 500,
      vy: -Math.random() * 500,
      life: 1 + Math.random(),
      col: Math.random() < 0.5 ? "#0ff" : "#f0f"
    });
  }
}

function spawnSparks(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 250, life: 0.4, col: "#ff0" });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.vy += 600 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Draw ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0220");
  g.addColorStop(0.6, "#2a0a4a");
  g.addColorStop(1, "#05020f");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#fff";
  for (const s of stars) {
    const x = ((s.x - camX * 0.1) % W + W) % W;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 500 + s.x);
    ctx.fillRect(x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawBike() {
  ctx.save();
  ctx.translate(bike.x - camX, bike.y);
  ctx.rotate(bike.angle);
  ctx.fillStyle = bike.color;
  ctx.fillRect(-40, -10, 80, 20); // Bike body
  ctx.fillRect(-10, 10, 20, -30); // Bike wheel
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.col;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x - camX, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawBike();
  drawObstacles();
  drawParticles();
  drawHUD();
}

function drawHUD() {
  distEl.textContent = Math.floor(distance);
}

function startGame() {
  overlay.classList.add("hidden");
  state = "play";
  distance = 0;
  camX = 0;
  particles = [];
  bike = newBike();
  bike.y = groundY(bike.x) - bike.wheelR;
  makeStars();
  loadLevel(0); // Start at level 0
}

// Procedural terrain: heights generated on demand
function groundY(x) {
  const difficulty = Math.min(1, distance / 5000);
  const base = H * 0.72;
  return base
    - Math.sin(x * 0.0018) * 60
    - Math.sin(x * 0.0051 + 1.3) * 30 * (0.5 + difficulty)
    - Math.sin(x * 0.011) * 10 * difficulty;
}

function makeStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, s: Math.random() * 1.5 + 0.5 });
  }
}

function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

let lastTime = 0;
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
