<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Moto</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05020f;
    overflow: hidden;
    font-family: "Courier New", monospace;
    color: #0ff;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 16px;
    font-size: 18px;
    text-shadow: 0 0 8px #0ff;
    pointer-events: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 2, 15, 0.75);
    text-align: center;
    font-size: 20px;
    text-shadow: 0 0 10px #f0f;
  }
  #overlay h1 {
    font-size: 56px;
    margin: 0 0 16px;
    color: #f0f;
    text-shadow: 0 0 20px #f0f, 0 0 40px #f0f;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">DISTANCE: <span id="dist">0</span> m &nbsp; BEST: <span id="best">0</span> m</div>
<div id="overlay">
  <h1>CYBER MOTO</h1>
  <p>RIGHT / D = Throttle &nbsp; LEFT / A = Brake &nbsp; UP / W = Lean forward &nbsp; DOWN / S = Lean back</p>
  <p>Press ENTER or SPACE to start</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const distEl = document.getElementById("dist");
const bestEl = document.getElementById("best");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- Input ----------
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if ((e.code === "Enter" || e.code === "Space") && state === "menu") startGame();
  if (e.code === "KeyR" && state === "dead") startGame();
});
window.addEventListener("keyup", e => keys[e.code] = false);

const input = {
  throttle: () => keys.ArrowRight || keys.KeyD,
  brake:    () => keys.ArrowLeft || keys.KeyA,
  leanFwd:  () => keys.ArrowUp || keys.KeyW,
  leanBack: () => keys.ArrowDown || keys.KeyS
};

// ---------- Game state ----------
let state = "menu";
let best = 0;
let distance = 0;
let camX = 0;
const GRAVITY = 1800;
const GROUND_SEG = 40;
let terrain = [];
let particles = [];
let stars = [];
let bike;

// Procedural terrain: heights generated on demand
function groundY(x) {
  // Smooth hills plus a bit of noise, gets steeper with distance
  const difficulty = Math.min(1, distance / 5000);
  const base = H * 0.72;
  return base
    - Math.sin(x * 0.0018) * 60
    - Math.sin(x * 0.0051 + 1.3) * 30 * (0.5 + difficulty)
    - Math.sin(x * 0.011) * 10 * difficulty;
}

function makeStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, s: Math.random() * 1.5 + 0.5 });
  }
}

function newBike() {
  return {
    x: 200,
    y: 0,
    vx: 0,
    vy: 0,
    angle: 0,          // body rotation
    angVel: 0,
    wheelR: 22,
    wheelAngle: 0,
    onGround: false,
    crashed: false,
    crashTimer: 0
  };
}

function startGame() {
  overlay.classList.add("hidden");
  state = "play";
  distance = 0;
  camX = 0;
  particles = [];
  bike = newBike();
  bike.y = groundY(bike.x) - bike.wheelR;
  makeStars();
}

// ---------- Update ----------
function update(dt) {
  if (state !== "play") return;

  if (bike.crashed) {
    bike.crashTimer += dt;
    updateParticles(dt);
    if (bike.crashTimer > 1.2) {
      state = "dead";
      if (distance > best) best = distance;
      bestEl.textContent = Math.floor(best);
      overlay.classList.remove("hidden");
      overlay.querySelector("h1").textContent = "SYSTEM FAILURE";
      overlay.querySelector("p:last-child").textContent = "Press R to reboot";
    }
    return;
  }

  // Throttle and braking
  const throttle = input.throttle() ? 1 : 0;
  const brake = input.brake() ? 1 : 0;
  let accel = throttle * 520 - brake * 380 - bike.vx * 0.15;
  if (!bike.onGround) accel *= 0.2;
  bike.vx += accel * dt;
  if (bike.vx < 0) bike.vx = 0;
  if (bike.vx > 900) bike.vx = 900;

  // Lean controls body angle in the air
  if (!bike.onGround) {
    if (input.leanFwd()) bike.angVel += 6 * dt;
    if (input.leanBack()) bike.angVel -= 6 * dt;
  }

  bike.vy += GRAVITY * dt;
  bike.x += bike.vx * dt;
  bike.y += bike.vy * dt;
  distance = Math.max(distance, (bike.x - 200) / 10);

  // Ground collision: wheels follow the terrain
  const gy = groundY(bike.x) - bike.wheelR;
  const slope = (groundY(bike.x + 4) - groundY(bike.x - 4)) / 8;
  bike.onGround = false;
  if (bike.y >= gy) {
    const impact = bike.vy;
    bike.y = gy;
    bike.vy = 0;
    bike.onGround = true;
    // Landing check: bad landing if body is tilted too far
    if (impact > 700 && Math.abs(bike.angle) > 0.9) {
      crash();
      return;
    }
    if (impact > 500) spawnSparks(bike.x, bike.y + bike.wheelR, 14);
    // Ride the slope
    bike.angVel += (Math.atan(slope) - bike.angle) * 0.2;
    bike.angVel *= 0.6;
  } else {
    bike.angVel *= 0.995;
  }

  bike.angle += bike.angVel * dt;
  bike.angVel *= 0.99;
  if (Math.abs(bike.angle) > 1.6) {
    crash();
    return;
  }
  // Keep the bike rolling in the air: angle wraps gently back when grounded
  if (bike.onGround) bike.angle *= 0.9;

  bike.wheelAngle += bike.vx * dt / bike.wheelR;

  // Exhaust trail
  if (bike.onGround && throttle && Math.random() < 0.6) {
    particles.push({ x: bike.x - 30, y: bike.y + 8, vx: -60 - Math.random() * 60, vy: -20 + Math.random() * -30, life: 0.5, col: "#f0f" });
  }
  updateParticles(dt);
  camX = bike.x - W * 0.3;
}

function crash() {
  bike.crashed = true;
  bike.crashTimer = 0;
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: bike.x, y: bike.y,
      vx: (Math.random() - 0.5) * 500,
      vy: -Math.random() * 500,
      life: 1 + Math.random(),
      col: Math.random() < 0.5 ? "#0ff" : "#f0f"
    });
  }
}

function spawnSparks(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 250, life: 0.4, col: "#ff0" });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.vy += 600 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Draw ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0220");
  g.addColorStop(0.6, "#2a0a4a");
  g.addColorStop(1, "#05020f");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars drift slowly with camera for parallax
  ctx.fillStyle = "#fff";
  for (const s of stars) {
    const x = ((s.x - camX * 0.1) % W + W) % W;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 500 + s.x);
    ctx.fillRect(x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // Neon grid on the horizon
  ctx.strokeStyle = "rgba(255,0,255,0.25)";
  ctx.lineWidth = 1;
  const horizon = H * 0.55;
  for (let i = 0; i < 10; i++) {
    const y = horizon + Math.pow(i / 10, 2) * (H - horizon);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  for (let i = -10; i < 30; i++) {
    const x = ((i * 120 - camX * 0.3) % (W * 2) + W * 2) % (W * 2) - W / 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 + (x - W / 2) * 0.1, horizon);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
}

function drawTerrain() {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W + GROUND_SEG; sx += GROUND_SEG) {
    ctx.lineTo(sx, groundY(sx + camX));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = "#12001f";
  ctx.fill();

  // Neon edge line
  ctx.beginPath();
  for (let sx = 0; sx <= W + GROUND_SEG; sx += GROUND_SEG) {
    const y = groundY(sx + camX);
    if (sx === 0) ctx.moveTo(sx, y); else ctx.lineTo(sx, y);
  }
  ctx.strokeStyle = "#0ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 15;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBike() {
  const sx = bike.x - camX;
  const sy = bike.y;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(bike.angle);

  // Wheels
  const wheelOffset = 42;
  for (const wx of [-wheelOffset, wheelOffset]) {
    ctx.save();
    ctx.translate(wx, bike.wheelR - bike.wheelR);
    ctx.beginPath();
    ctx.arc(0, 0, bike.wheelR, 0, Math.PI * 2);
    ctx.strokeStyle = "#0ff";
    ctx.lineWidth = 4;
    ctx.shadowColor = "#0ff";
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Spokes
    ctx.rotate(bike.wheelAngle);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * bike.wheelR, Math.sin(a) * bike.wheelR);
    }
    ctx.strokeStyle = "rgba(0,255,255,0.6)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // Frame
  ctx.beginPath();
  ctx.moveTo(-wheelOffset, 0);
  ctx.lineTo(-5, -28);
  ctx.lineTo(wheelOffset, 0);
  ctx.moveTo(-5, -28);
  ctx.lineTo(10, -2);
  ctx.lineTo(-wheelOffset, 0);
  ctx.strokeStyle = "#f0f";
  ctx.lineWidth = 5;
  ctx.shadowColor = "#f0f";
  ctx.shadowBlur = 14;
  ctx.stroke();

  // Rider
  ctx.beginPath();
  ctx.moveTo(-5, -28);
  ctx.lineTo(-14, -52);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(-14, -62, 8, 0, Math.PI * 2);
  ctx.fillStyle = "#0ff";
  ctx.shadowColor = "#0ff";
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - camX + bike.x * 0 - (bike.x - camX - bike.x) * 0, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawFinishHint() {
  // Distance markers every 500 m for orientation
  ctx.fillStyle = "#0ff";
  ctx.font = "14px Courier New";
  const startM = Math.floor(distance / 50) * 50;
  for (let m = startM; m < startM + 1500; m += 50) {
    const wx = 200 + m * 10 - camX;
    if (wx < -50 || wx > W + 50) continue;
    ctx.fillRect(wx, groundY(wx + camX) - 20, 2, 20);
    if (m % 500 === 0) ctx.fillText(m + "m", wx + 4, groundY(wx + camX) - 24);
  }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  update(dt);

  ctx.clearRect(0, 0, W, H);
  drawBackground();
  if (state === "play" || state === "dead") {
    drawTerrain();
    drawFinishHint();
    drawBike();
    drawParticles();
    distEl.textContent = Math.floor(distance);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
